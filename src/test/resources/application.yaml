spring:
  application:
    name: payment-risk-engine-test

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        options: "-c TimeZone=UTC"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 1
    topic:
      payment-events: payment.events

  security:
    jwt:
      secret: test-secret-key-for-integration-tests-min-32-chars
      expiration-ms: 3600000
      issuer: payment-risk-engine-test

logging:
  level:
    root: WARN
    com.karan.risk.paymentriskengine: INFO
    org.testcontainers: INFO
    com.github.dockerjava: WARN
    org.springframework.test: INFO

rules:
  velocity:
    max-transactions: 5
    window-minutes: 10
  amount:
    elevated: 10000
    high: 100000
    critical: 1000000
  geo:
    high-risk-countries: KP,IR,SY,CU
    high-risk-score: 80
    mismatch-score: 40
  blacklist:
    entries: FRAUD_999,SUSPECT_001,MULE_042

scoring:
  thresholds:
    review: 30
    decline: 70
