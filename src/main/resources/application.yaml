spring:
  application:
    name: payment-risk-engine

  profiles:
    active: dev

  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/riskengine}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        options: "-c TimeZone=UTC"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    topic:
      payment-events: payment.events

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${APP_PORT:8080}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.karan.risk.paymentriskengine: ${LOG_LEVEL_APP:DEBUG}

rules:
  velocity:
    max-transactions: 5
    window-minutes: 10
  amount:
    elevated: 10000
    high: 100000
    critical: 1000000
  geo:
    high-risk-countries: KP,IR,SY,CU
    high-risk-score: 80
    mismatch-score: 40
  blacklist:
    entries: SUSPECT_001,FRAUD_999,MULE_042

scoring:
  thresholds:
    review: 30
    decline: 70
